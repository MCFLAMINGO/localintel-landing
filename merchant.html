<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="canonical" href="https://www.thelocalintel.com/merchant">
  <title>Redirecting — LocalIntel</title>
  <script>
    // merchant.html → Business Home (inbox.html)
    // Swarm POST /merchant/request-link emails a permanent dispatch_token
    // (never the legacy 24h dashboard_token). Preserve ?token= here.
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const dest = token
      ? '/inbox.html?token=' + encodeURIComponent(token)
      : '/inbox.html';
    window.location.replace(dest);
  </script>
  <meta property="og:image" content="https://www.thelocalintel.com/images/localintel-logo-512.jpg">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="twitter:card" content="summary">
  <meta property="twitter:image" content="https://www.thelocalintel.com/images/localintel-logo-512.jpg">
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:2rem;text-align:center;">
    Opening your Business Home…
  </p>
</body>
</html>
