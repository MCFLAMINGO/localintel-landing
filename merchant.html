<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting — LocalIntel</title>
  <script>
    // merchant.html is now merged into inbox.html
    // Preserve the token param if present
    const token = new URLSearchParams(window.location.search).get('token');
    const dest  = token
      ? '/inbox.html?token=' + encodeURIComponent(token)
      : '/inbox.html';
    window.location.replace(dest);
  </script>
</head>
<body></body>
</html>
