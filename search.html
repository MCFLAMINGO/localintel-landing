<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalIntel — Search Businesses</title>
  <meta name="description" content="Search 122,000+ verified Florida businesses by name, category, or ZIP code.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2316A34A'/><circle cx='16' cy='16' r='6' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FFFFFF;
      --bg-card: #F9FAFB;
      --text: #111827;
      --text-2: #6B7280;
      --text-3: #9CA3AF;
      --accent: #16A34A;
      --accent-hover: #15803D;
      --accent-light: #DCFCE7;
      --accent-text: #166534;
      --border: #E5E7EB;
      --radius-sm: 6px;
      --radius: 10px;
      --radius-lg: 16px;
      --shadow: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --max: 860px;
      --nav-h: 64px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font); font-size: 16px; line-height: 1.65; color: var(--text); background: var(--bg); }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; background: none; font: inherit; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--nav-h);
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: var(--max); margin: 0 auto; padding: 0 24px;
      height: 100%; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; letter-spacing: -0.4px; }
    .logo-dot { width: 22px; height: 22px; background: var(--accent); border-radius: 50%; position: relative; flex-shrink: 0; }
    .logo-dot::after { content: ''; position: absolute; width: 8px; height: 8px; background: white; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .nav-back { font-size: 14px; font-weight: 500; color: var(--text-2); display: flex; align-items: center; gap: 6px; transition: color 0.15s; }
    .nav-back:hover { color: var(--text); }

    /* PAGE LAYOUT */
    .page-wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: calc(var(--nav-h) + 24px) 16px 180px;
    }

    /* PAGE HEADER */
    .page-header {
      text-align: center;
      padding: 32px 16px 28px;
    }
    .page-header h1 {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .page-header p { font-size: 14px; color: var(--text-2); }

    /* FILTERS ROW */
    .filters-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding: 0 4px;
    }
    .filter-select {
      padding: 8px 12px;
      font-size: 13px;
      font-family: var(--font);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: white;
      color: var(--text);
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
      flex: 1;
      min-width: 120px;
    }
    .filter-select:focus { border-color: var(--accent); }

    /* CONVERSATION THREAD */
    .thread {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 24px;
    }

    /* USER BUBBLE */
    .bubble-user {
      display: flex;
      justify-content: flex-end;
    }
    .bubble-user-inner {
      background: var(--accent);
      color: white;
      border-radius: 18px 18px 4px 18px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 500;
      max-width: 80%;
      line-height: 1.5;
    }

    /* AGENT ANSWER */
    .bubble-agent {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .agent-avatar {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      margin-top: 2px;
    }
    .agent-avatar::after {
      content: '';
      width: 12px; height: 12px;
      background: white;
      border-radius: 50%;
    }
    .bubble-agent-body { flex: 1; min-width: 0; }

    /* NARRATIVE ANSWER */
    .agent-narrative {
      background: linear-gradient(135deg, #F0FDF4 0%, #DCFCE7 100%);
      border: 1.5px solid #86EFAC;
      border-radius: 4px 18px 18px 18px;
      padding: 16px 20px;
      font-size: 15px;
      line-height: 1.7;
      color: #1A2E1A;
      margin-bottom: 12px;
    }
    .agent-narrative .label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .label-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink:0; }

    /* TASK HANDOFF CARD */
    .agent-task-card {
      background: white;
      border: 1.5px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 4px 12px 12px 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }
    .task-job-id {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 4px;
    }
    .task-status {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .task-action-btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 14px;
      padding: 9px 20px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 4px;
    }

    /* RESULT CARDS SECTION */
    .results-section {
      margin-top: 4px;
    }
    .results-count {
      font-size: 13px;
      color: var(--text-2);
      font-weight: 500;
      margin-bottom: 10px;
      padding-left: 2px;
    }

    /* RESULT CARD */
    .result-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .result-card:hover { box-shadow: var(--shadow); border-color: #D1FAE5; }
    .result-icon { width: 40px; height: 40px; background: var(--accent-light); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .result-body { flex: 1; min-width: 0; }
    .result-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .result-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: var(--accent-light); color: var(--accent-text); padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; }
    .result-detail-link { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-2); margin-right: 12px; margin-top: 3px; transition: color .15s; }
    .result-detail-link:hover { color: var(--accent); }
    .result-right { flex-shrink: 0; text-align: right; }
    .result-zip { font-size: 13px; font-weight: 700; }
    .result-status { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .result-status.claimed { color: var(--accent); font-weight: 600; }

    /* LOADING SPINNER */
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .thinking-bubble {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px 18px 18px 18px;
      color: var(--text-2);
      font-size: 14px;
    }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 40px 24px; color: var(--text-2); }
    .empty-icon { font-size: 36px; margin-bottom: 12px; }

    /* STICKY INPUT BAR */
    .input-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 12px 16px 16px;
      z-index: 90;
    }
    .input-bar-inner {
      max-width: var(--max);
      margin: 0 auto;
    }
    .input-row {
      display: flex;
      gap: 8px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: white;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: border-color 0.2s;
    }
    .input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(22,163,74,0.1), var(--shadow); }
    .search-input {
      flex: 1;
      padding: 14px 16px;
      font-size: 15px;
      font-family: var(--font);
      border: none;
      outline: none;
      color: var(--text);
      background: transparent;
    }
    .search-input::placeholder { color: var(--text-3); }
    .send-btn {
      padding: 12px 20px;
      background: var(--accent);
      color: white;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font);
      transition: background 0.18s;
      border: none;
      white-space: nowrap;
      display: flex; align-items: center; gap: 8px;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-icon { font-size: 16px; }

    /* CALL CTA */
    .call-cta {
      text-align: center;
      margin-top: 8px;
    }
    .call-link {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 18px;
      background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
      border-radius: 8px; color: #fff;
      box-shadow: 0 2px 10px rgba(22,163,74,.25);
      font-size: 13px; font-weight: 600;
      text-decoration: none;
    }
    .call-pulse { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink:0; animation: pulse-ring 1.8s ease-out infinite; }
    @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.6); } 70% { box-shadow: 0 0 0 6px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }

    @media (max-width: 640px) {
      .result-card { flex-wrap: wrap; gap: 10px; }
      .result-right { flex: 0 0 100%; text-align: left; display: flex; gap: 12px; align-items: center; }
      .bubble-user-inner { max-width: 90%; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo"><div class="logo-dot"></div>LocalIntel</a>
      <a href="/" class="nav-back">← Back to home</a>
    </div>
  </nav>

  <div class="page-wrap">

    <div class="page-header">
      <h1>Search Florida Businesses</h1>
      <p>122,000+ verified listings — ask anything in plain English</p>
    </div>

    <div class="filters-row">
      <select id="zipFilter" class="filter-select">
        <option value="">All ZIPs</option>
        <option value="32082">32082 — Ponte Vedra Beach</option>
        <option value="32081">32081 — Nocatee</option>
        <option value="32092">32092 — World Golf Village</option>
        <option value="32080">32080 — St. Augustine</option>
        <option value="32084">32084 — St. Augustine</option>
        <option value="32205">32205 — Jacksonville</option>
        <option value="32207">32207 — Jacksonville</option>
        <option value="32210">32210 — Jacksonville</option>
        <option value="32216">32216 — Jacksonville</option>
        <option value="32224">32224 — Jacksonville Beach</option>
        <option value="32225">32225 — Jacksonville</option>
        <option value="32256">32256 — Jacksonville</option>
        <option value="32259">32259 — St. Johns</option>
      </select>
      <select id="categoryFilter" class="filter-select">
        <option value="">All Categories</option>
        <option value="restaurant">Restaurant</option>
        <option value="healthcare">Healthcare</option>
        <option value="retail">Retail</option>
        <option value="construction">Construction</option>
        <option value="professional_services">Professional Services</option>
        <option value="landscaping">Landscaping</option>
        <option value="cleaning">Cleaning</option>
        <option value="hvac">HVAC</option>
        <option value="plumber">Plumbing</option>
        <option value="electrician">Electrical</option>
        <option value="real_estate">Real Estate</option>
        <option value="finance">Financial Services</option>
        <option value="auto_repair">Automotive</option>
        <option value="beauty">Beauty &amp; Wellness</option>
        <option value="education">Education</option>
      </select>
      <select id="statusFilter" class="filter-select">
        <option value="">Any Status</option>
        <option value="claimed">Claimed</option>
        <option value="unclaimed">Unclaimed</option>
      </select>
    </div>

    <!-- CONVERSATION THREAD -->
    <div class="thread" id="thread"></div>

    <!-- RESULTS (latest query) -->
    <div id="resultsArea"></div>

  </div>

  <!-- STICKY INPUT BAR -->
  <div class="input-bar">
    <div class="input-bar-inner">
      <div class="input-row">
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Ask anything — &quot;I need a landscaper&quot;, &quot;restaurants in 32082&quot;, &quot;what does McFlamingo serve?&quot;"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="send-btn" onclick="sendMessage()" id="sendBtn">
          <span id="sendLabel">Ask</span>
          <span class="send-icon">→</span>
        </button>
      </div>
      <div class="call-cta">
        <a href="tel:+19045067476" class="call-link">
          <span class="call-pulse"></span>
          Skip the search — just call (904) 506-7476
        </a>
      </div>
    </div>
  </div>

  <script>
    const SEARCH_URL = 'https://gsb-swarm-production.up.railway.app/api/local-intel/search';

    // ── Conversation state ─────────────────────────────────────────────────────
    // Thread = [{role:'user'|'agent', text, result, cards}]
    // Context = last resolved entity (business name, zip, category) for follow-ups
    const thread = [];
    let context = { zip: null, category: null, lastBusiness: null, lastResultNames: [] };
    let isLoading = false;

    // ── Utilities ──────────────────────────────────────────────────────────────
    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    const CAT_ICONS = {
      restaurant:'🍽️', food:'🍽️', cafe:'☕', bar:'🍺',
      health:'🏥', medical:'🏥', dental:'🦷', pharmacy:'💊',
      retail:'🛍️', shop:'🛍️', store:'🛍️',
      construction:'🔨', contractor:'🔨', roofing:'🏗️',
      landscaping:'🌿', lawn:'🌿', tree:'🌿',
      cleaning:'🧹', maid:'🧹',
      hvac:'❄️', plumbing:'🔧', electrical:'⚡',
      realty:'🏠', 'real estate':'🏠',
      auto:'🚗', car:'🚗',
      beauty:'💅', salon:'💇', spa:'💆',
      education:'📚', school:'📚',
      finance:'💼', insurance:'🛡️', law:'⚖️',
      default:'🏢',
    };
    function getIcon(cat) {
      const lower = (cat||'').toLowerCase();
      for (const [k,v] of Object.entries(CAT_ICONS)) { if (lower.includes(k)) return v; }
      return CAT_ICONS.default;
    }

    // ── Context resolution ─────────────────────────────────────────────────────
    // Detect follow-up pronouns/references and inject prior context into the query
    const FOLLOW_UP_RE = /\b(they|them|their|it|this company|this business|that place|the company|the business)\b/i;

    function resolveQuery(raw) {
      let q    = raw.trim();
      let zip  = document.getElementById('zipFilter').value;
      let cat  = document.getElementById('categoryFilter').value;

      // If query references prior results by pronoun, inject last business name
      if (FOLLOW_UP_RE.test(q) && context.lastBusiness) {
        q = q.replace(FOLLOW_UP_RE, context.lastBusiness);
      }

      // Inherit ZIP from filter or prior context
      if (!zip && context.zip) zip = context.zip;
      if (!cat && context.category) cat = context.category;

      return { q, zip, cat };
    }

    // ── Detect task handoff intent ─────────────────────────────────────────────
    const TASK_FIRE_RE = /\b(ok(?:ay)?[\s,]+(?:call|contact|text|email|send|reach|ping|message|ask)\s+them|go\s+ahead|yes[\s,]+call|send\s+(?:them|it)|fire\s+(?:it|that)|book\s+it|schedule\s+it|do\s+it)\b/i;

    // ── API call ───────────────────────────────────────────────────────────────
    async function callSearch(q, zip, cat) {
      const params = new URLSearchParams();
      if (q)   params.set('q', q);
      if (zip) params.set('zip', zip);
      if (cat) params.set('cat', cat);
      // Pass full thread context for follow-up awareness
      if (context.lastBusiness) params.set('ctx_business', context.lastBusiness);
      if (context.lastResultNames.length) params.set('ctx_names', context.lastResultNames.slice(0,5).join(','));
      const res = await fetch(`${SEARCH_URL}?${params}`, {
        headers: { 'X-Agent-Origin': 'localintel-search-ui' },
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // ── Render a business card ─────────────────────────────────────────────────
    function renderCard(biz) {
      const icon    = getIcon(biz.category || biz.category_group);
      const claimed = biz.claimed || biz.claimed_at || biz.wallet;
      const cat     = biz.category || biz.category_group || '';
      const addr    = [biz.address, biz.city].filter(Boolean).join(', ');
      const full    = addr ? `${addr}, FL ${biz.zip||''}` : (biz.zip ? `${biz.zip}, FL` : '');
      const mapUrl  = (biz.lat && biz.lon)
        ? `https://www.openstreetmap.org/?mlat=${biz.lat}&mlon=${biz.lon}&zoom=17`
        : `https://www.openstreetmap.org/search?query=${encodeURIComponent(full)}`;

      // Rich detail lines — only show when data exists
      const blurb   = biz.description || biz.services_text || '';
      const hoursStr = biz.hours || '';
      const tier    = biz.price_tier ? { casual:'$–$$', upscale:'$$$', fine_dining:'$$$$' }[biz.price_tier] || biz.price_tier : '';

      return `
        <div class="result-card">
          <div class="result-icon">${icon}</div>
          <div class="result-body">
            <div class="result-name">
              ${biz.website
                ? `<a href="${esc(biz.website)}" target="_blank" rel="noopener" style="border-bottom:1px dotted var(--border);">${esc(biz.name||'Unnamed')}</a>`
                : esc(biz.name||'Unnamed')}
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;">
              ${cat ? `<span class="result-tag">${esc(cat)}</span>` : ''}
              ${tier ? `<span class="result-tag" style="background:#FEF9C3;color:#854D0E;">${esc(tier)}</span>` : ''}
            </div>
            ${blurb ? `<div style="font-size:13px;color:var(--text-2);margin-bottom:5px;line-height:1.5;">${esc(blurb.slice(0,120))}${blurb.length>120?'…':''}</div>` : ''}
            ${hoursStr && !/addId|thunderbolt|function/.test(hoursStr) ? `<div style="font-size:12px;color:var(--text-3);margin-bottom:4px;">🕐 ${esc(hoursStr)}</div>` : ''}
            <div>
              ${full ? `<a href="${mapUrl}" target="_blank" rel="noopener" class="result-detail-link">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                ${esc(full)}</a>` : ''}
              ${biz.phone ? `<a href="tel:${biz.phone.replace(/\D/g,'')}" class="result-detail-link">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13 19.79 19.79 0 0 1 1.6 4.38 2 2 0 0 1 3.57 2.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.08 6.08l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 21.73 17z"/></svg>
                ${esc(biz.phone)}</a>` : ''}
              ${biz.website ? `<a href="${esc(biz.website)}" target="_blank" rel="noopener" class="result-detail-link">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                ${esc(biz.website.replace(/^https?:\/\//,''))}</a>` : ''}
            </div>
          </div>
          <div class="result-right">
            <div class="result-zip">${esc(biz.zip||'')}</div>
            <div class="result-status${claimed?' claimed':''}">
              ${claimed ? '✓ Claimed' : 'Unclaimed'}
            </div>
            <a href="${mapUrl}" target="_blank" rel="noopener"
               style="display:inline-block;margin-top:6px;font-size:11px;color:var(--accent);font-weight:600;">
              Map →
            </a>
          </div>
        </div>`;
    }

    // ── Render agent answer bubble ─────────────────────────────────────────────
    function buildAgentBubble(result, rawQuery) {
      let narrativeHtml = '';
      let cardsHtml     = '';
      let countHtml     = '';

      const businesses  = Array.isArray(result?.results) ? result.results : [];
      const narrative   = result?.narrative || null;
      const notables    = result?.notable_businesses || [];
      const isTask      = result?.type === 'service_request';
      const isDeflect   = result?.type === 'out_of_scope';
      const jobCode     = result?.job_code || null;

      // ── Narrative / answer text ──
      if (narrative || notables.length) {
        const spotlit = notables.filter(b => b.description || (b.tags && b.tags.length)).slice(0,3);
        const spotlightHtml = spotlit.map(b => {
          const desc = b.description || `Known for: ${(b.tags||[]).slice(0,4).join(', ')}`;
          return `<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(22,163,74,0.15);">
            <span style="font-weight:600;">${esc(b.name)}</span>
            <span style="opacity:0.85;font-size:14px;"> — ${esc(desc)}</span>
            ${b.website ? `<a href="${esc(b.website)}" target="_blank" rel="noopener" style="margin-left:6px;font-size:12px;opacity:0.6;color:inherit;">↗</a>` : ''}
          </div>`;
        }).join('');

        const mainText = (narrative || '').replace(
          /(https?:\/\/[^\s<>"]+)/g,
          url => `<a href="${url}" target="_blank" rel="noopener" style="color:var(--accent);">${url.replace(/^https?:\/\//,'')}</a>`
        );

        narrativeHtml = `
          <div class="agent-narrative">
            <div class="label"><span class="label-dot"></span> LocalIntel</div>
            ${mainText ? `<div>${mainText}</div>` : ''}
            ${spotlightHtml}
          </div>`;
      } else if (isDeflect) {
        narrativeHtml = `
          <div class="agent-narrative">
            <div class="label"><span class="label-dot"></span> LocalIntel</div>
            <div>${esc(result.narrative || "That's outside my lane — try asking for a restaurant, landscaper, doctor, or any local service.")}</div>
          </div>`;
      } else if (!businesses.length) {
        // No results at all
        narrativeHtml = `
          <div class="agent-narrative">
            <div class="label"><span class="label-dot"></span> LocalIntel</div>
            <div>No results found for <strong>${esc(rawQuery)}</strong>. Try a different name, category, or ZIP.</div>
          </div>`;
      }

      // ── Task handoff card (service request fired) ──
      if (isTask) {
        narrativeHtml += `
          <div class="agent-task-card">
            ${jobCode ? `<div class="task-job-id">Job ${esc(jobCode)}</div>` : ''}
            <div class="task-status">Request sent to matching providers</div>
            <div style="font-size:13px;color:var(--text-2);margin-bottom:12px;">
              Providers have been notified. Call us and we'll connect you when someone responds.
            </div>
            <a href="tel:+19045067476" class="task-action-btn">Call (904) 506-7476</a>
          </div>`;
      }

      // ── Business cards ──
      if (businesses.length) {
        const status   = document.getElementById('statusFilter').value;
        let filtered   = businesses;
        if (status === 'claimed')   filtered = filtered.filter(b => b.claimed || b.claimed_at || b.wallet);
        if (status === 'unclaimed') filtered = filtered.filter(b => !b.claimed && !b.claimed_at && !b.wallet);

        if (filtered.length) {
          countHtml = `<div class="results-count">${result.total || filtered.length} businesses found</div>`;
          cardsHtml = `<div>${filtered.map(renderCard).join('')}</div>`;
        }
      }

      return `
        <div class="bubble-agent">
          <div class="agent-avatar"></div>
          <div class="bubble-agent-body">
            ${narrativeHtml}
            <div class="results-section">
              ${countHtml}
              ${cardsHtml}
            </div>
          </div>
        </div>`;
    }

    // ── Update context from result ─────────────────────────────────────────────
    function updateContext(result, zip, cat) {
      if (zip) context.zip = zip;
      if (cat) context.category = cat;
      const names = (result?.results||[]).map(b => b.name).filter(Boolean);
      if (names.length) {
        context.lastResultNames = names;
        context.lastBusiness    = names[0]; // top result = default "they/them" reference
      }
    }

    // ── Render entire thread ───────────────────────────────────────────────────
    function renderThread() {
      const el = document.getElementById('thread');
      el.innerHTML = thread.map(item => {
        if (item.role === 'user') {
          return `<div class="bubble-user"><div class="bubble-user-inner">${esc(item.text)}</div></div>`;
        }
        return item.html || '';
      }).join('');
      // Scroll to bottom
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    // ── Show thinking indicator ────────────────────────────────────────────────
    function showThinking() {
      const el = document.getElementById('resultsArea');
      el.innerHTML = `
        <div class="bubble-agent">
          <div class="agent-avatar"></div>
          <div class="bubble-agent-body">
            <div class="thinking-bubble">
              <div class="spinner"></div>
              <span>Searching 122,000+ businesses...</span>
            </div>
          </div>
        </div>`;
    }

    // ── Main send handler ──────────────────────────────────────────────────────
    async function sendMessage() {
      const input = document.getElementById('searchInput');
      const raw   = input.value.trim();
      if (!raw || isLoading) return;

      isLoading = true;
      input.value = '';
      document.getElementById('sendBtn').disabled = true;

      // Push user bubble to thread
      thread.push({ role: 'user', text: raw });
      renderThread();
      showThinking();

      try {
        // Task handoff shortcut — "ok call them"
        if (TASK_FIRE_RE.test(raw) && context.lastBusiness) {
          // Fire RFQ for the last business in context
          const taskResult = await callSearch(`contact ${context.lastBusiness}`, context.zip, context.category);
          const html = buildAgentBubble(taskResult, raw);
          thread.push({ role: 'agent', html });
          updateContext(taskResult, context.zip, context.category);
        } else {
          const { q, zip, cat } = resolveQuery(raw);
          const result = await callSearch(q, zip, cat);
          const html   = buildAgentBubble(result, raw);
          thread.push({ role: 'agent', html });
          updateContext(result, zip, cat);
        }
      } catch (e) {
        thread.push({ role: 'agent', html: `
          <div class="bubble-agent">
            <div class="agent-avatar"></div>
            <div class="bubble-agent-body">
              <div class="agent-narrative">
                <div class="label"><span class="label-dot"></span> LocalIntel</div>
                <div>Something went wrong: ${esc(e.message)}. Try again.</div>
              </div>
            </div>
          </div>` });
      } finally {
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('resultsArea').innerHTML = '';
        renderThread();
        input.focus();
      }
    }

    // ── Filter change — re-run last query ──────────────────────────────────────
    function rerunLastQuery() {
      if (!thread.length) return;
      const lastUser = [...thread].reverse().find(t => t.role === 'user');
      if (lastUser) {
        document.getElementById('searchInput').value = lastUser.text;
        sendMessage();
      }
    }
    document.getElementById('zipFilter').addEventListener('change', rerunLastQuery);
    document.getElementById('categoryFilter').addEventListener('change', rerunLastQuery);
    document.getElementById('statusFilter').addEventListener('change', () => { if (thread.length) renderThread(); });
    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    // ── Auto-open with 32082 default ───────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      const zipEl = document.getElementById('zipFilter');
      if (zipEl && !zipEl.value) zipEl.value = '32082';
      // Seed first message
      document.getElementById('searchInput').value = 'Where should I eat in Ponte Vedra?';
      sendMessage();
    });
  </script>
</body>
</html>
