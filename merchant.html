<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting — LocalIntel</title>
  <script>
    // merchant.html is now merged into inbox.html
    // Preserve the token param if present
    const token = new URLSearchParams(window.location.search).get('token');
    const dest  = token
      ? '/inbox.html?token=' + encodeURIComponent(token)
      : '/inbox.html';
    window.location.replace(dest);
  </script>
  <meta property="og:image" content="https://www.thelocalintel.com/images/localintel-logo-512.jpg">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="twitter:card" content="summary">
  <meta property="twitter:image" content="https://www.thelocalintel.com/images/localintel-logo-512.jpg">
</head>
<body></body>
</html>
